openapi: 3.0.3
info:
  title: ChessGameManagement - API
  description: API for ChessHub to manage users, clubs, teams, and chess games.
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management and lookup
  - name: Clubs
    description: Club management
  - name: Teams
    description: Team management
  - name: Games
    description: Game tracking and scoresheets
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in. Returns user info and sets HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=abcde12345; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSimple'
        '401':
          description: Unauthorized
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      operationId: logout
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Clears the auth cookie
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSimple'
  /users/me:
    get:
      tags: [Users]
      summary: Get details of the currently logged in user
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/me/clubs:
    get:
      tags: [Users]
      summary: Get club affiliations of the current user
      operationId: getMyClubs
      responses:
        '200':
          description: List of club affiliations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClubAffiliation'
  /users:
    get:
      tags: [Users]
      summary: Get a simple list of all users for lookup
      operationId: getAllUsers
      responses:
        '200':
          description: List of simple users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSimple'
  /clubs:
    get:
      tags: [Clubs]
      summary: Get a simple list of all clubs for lookup
      operationId: getAllClubs
      responses:
        '200':
          description: List of simple clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClubSimple'
  /clubs/{clubId}:
    get:
      tags: [Clubs]
      summary: Get club details by ID
      operationId: getClubById
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Club details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
  /clubs/{clubId}/teams:
    get:
      tags: [Clubs]
      summary: Get teams belonging to a club
      operationId: getTeamsByClub
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamSimple'
  /teams/{teamId}:
    get:
      tags: [Teams]
      summary: Get team details by ID
      operationId: getTeamById
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
  /games:
    post:
      tags: [Games]
      summary: Save a new game
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRequest'
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
  /games/{gameId}:
    get:
      tags: [Games]
      summary: Get game details by ID
      operationId: getGameById
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
  /games/user/{userId}:
    get:
      tags: [Games]
      summary: Get all games of a specific user
      operationId: getGamesByUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
  /games/club/{clubId}:
    get:
      tags: [Games]
      summary: Get all games played by members of a specific club
      operationId: getGamesByClub
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Authentication cookie set after successful login.
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          
    RegisterRequest:
      type: object
      required: [name, userName, email, password]
      properties:
        name:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          
    AppRole:
      type: string
      enum: [SUPER_ADMIN, SUPPORT, USER]
      
    ClubMemberStatus:
      type: string
      enum: [APPLICANT, MEMBER, FORMER_MEMBER, BANNED]
      
    TeamRole:
      type: string
      enum: [ADMIN, CAPTAIN, HEAD_COACH, PLAYER, RESERVE]
      
    ClubRole:
      type: string
      enum: [ADMIN, DEPUTY_ADMIN, MEMBER]

    UserSimple:
      type: object
      required: [id, name, userName]
      properties:
        id:
          type: integer
        name:
          type: string
        userName:
          type: string

    User:
      type: object
      required: [id, name, userName, email, appRole]
      properties:
        id:
          type: integer
        name:
          type: string
        userName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        appRole:
          $ref: '#/components/schemas/AppRole'
        fideId:
          type: string
        lichessUsername:
          type: string
        chesscomUsername:
          type: string
        clubIds:
          type: array
          items:
            type: integer
        teamIds:
          type: array
          items:
            type: integer

    ClubSimple:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    Club:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        adminId:
          type: integer

    ClubAffiliation:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        adminId:
          type: integer
        adminName:
          type: string
        status:
          $ref: '#/components/schemas/ClubMemberStatus'

    TeamSimple:
      type: object
      required: [id, name, clubName]
      properties:
        id:
          type: integer
        name:
          type: string
        clubName:
          type: string
        adminId:
          type: integer

    TeamMember:
      type: object
      required: [id, name, roles]
      properties:
        id:
          type: integer
        name:
          type: string
        userName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TeamRole'

    Team:
      type: object
      required: [id, clubId, name]
      properties:
        id:
          type: integer
        clubId:
          type: integer
        clubName:
          type: string
        name:
          type: string
        adminId:
          type: integer
        adminName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    Game:
      type: object
      required: [id, moves]
      properties:
        id:
          type: integer
        whitePlayerId:
          type: integer
        blackPlayerId:
          type: integer
        whitePlayerName:
          type: string
        blackPlayerName:
          type: string
        date:
          type: string
          format: date
          example: "2024-11-25"
        opening:
          type: string
        event:
          type: string
        site:
          type: string
        board:
          type: string
        result:
          type: string
        round:
          type: integer
        moves:
          type: string
        teamId:
          type: integer
        teamName:
          type: string

    GameRequest:
      type: object
      required: [moves]
      properties:
        whitePlayerName:
          type: string
        blackPlayerName:
          type: string
        date:
          type: string
          format: date
          example: "2024-11-25"
        event:
          type: string
        teamId:
          type: integer
        moves:
          type: string

security:
  - cookieAuth: []